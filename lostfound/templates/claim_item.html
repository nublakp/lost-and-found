<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Claim Item</title>
      <link rel="stylesheet" href="{% static 'css/claim.css' %}">
</head>
<body>

<div class="container">
    <h2>Claim This Item</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Your Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Contact Info</label>
            <input type="text" name="contact" placeholder="Phone or Email" required>
        </div>

        <div class="form-group">
            <label>Describe Proof</label>
            <textarea name="message" placeholder="Explain why this item belongs to you..." required></textarea>
        </div>
        <div class="form-group">
            <label>Upload Image</label>
            <input type="file" name="image">
        </div>

        <button type="submit">Submit Claim</button>
    </form>
</div>

</body>
</html>
